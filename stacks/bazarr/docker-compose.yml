services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:${TAG:-latest}
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    network_mode: host
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Africa/Nairobi}
    volumes:
      - bazarr-config:/config
      - "/mnt/d/Entertainment/MOVIES:/movies"
      - "/mnt/d/Entertainment/TV:/tv"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bazarr-config:
    name: bazarr-config
