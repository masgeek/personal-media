services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION:-1.6.0-ls360}
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    network_mode: host
    environment:
      PUID: ${BAZARR_PUID:-1000}
      PGID: ${BAZARR_PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - bazarr-config:/config
      - /mnt/d/Entertainment/Movies:/mnt/d/Entertainment/Movies
      - /mnt/d/Entertainment/TV:/mnt/d/Entertainment/TV
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bazarr-config:
    name: bazarr-config
