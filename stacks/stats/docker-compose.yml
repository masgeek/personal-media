services:
  jellyglance:
    image: ghcr.io/jellyglance/server:${JELLYGLANCE_TAG:-latest}
    container_name: jellyglance
    hostname: jellyglance
    restart: unless-stopped
    environment:
      # Shared Postgres from stacks/postgres, on its own database. Plain
      # PostgreSQL is enough; no extension is required.
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_IP: ${DB_HOST:-postgres}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${DB_DATABASE:-jellyglance}
      # Changing this invalidates every existing login, so keep it stable.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TZ: ${TZ:-UTC}
      JS_PUBLIC_URL: ${JELLYGLANCE_PUBLIC_URL:-https://stat.munywele.co.ke}
      CONFIG_DIR: /app/config
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:8930:3000"
    volumes:
      - jellyglance_config:/app/config
      - jellyglance_backups:/app/backups
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jellyglance_config:
  jellyglance_backups:

networks:
  dokploy-network:
    external: true