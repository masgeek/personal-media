services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:${TDARR_VERSION:-2.94.02}
    container_name: tdarr
    hostname: tdarr
    restart: unless-stopped

    # Host networking so Tdarr can reach the Windows-hosted Radarr and Sonarr
    # at 127.0.0.1. This means no ports block is needed: 8265 and 8266 are
    # already bound on the host.
    network_mode: host

    environment:
      TZ: ${TZ:-Africa/Nairobi}
      PUID: ${TDARR_PUID:-1000}
      PGID: ${TDARR_PGID:-1000}
      UMASK_SET: "002"

      # Bind to all interfaces. Nodes connect outbound to serverPort, so no
      # inbound node port is required.
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"

      # internalNode runs a Tdarr Node inside the Server container. Without it
      # the server starts but never transcodes anything.
      internalNode: "true"
      inContainer: "true"
      nodeName: ${TDARR_NODE_NAME:-internal-node}
      ffmpegVersion: "7"

      auth: "false"
      openBrowser: "false"
      maxLogSizeMB: "10"
      cronPluginUpdate: ""

      # NVIDIA GPU passthrough
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all

    volumes:
      # Server database, samples, and plugins
      - ../files/tdarr/server:/app/server
      # Server and node JSON config. pathTranslators can only be set here,
      # they have no environment variable equivalent.
      - ../files/tdarr/configs:/app/configs
      - ../files/tdarr/logs:/app/logs
      # Working files during transcode. Keep this on local SSD if possible.
      - ../files/transcode/tdarr:/temp
      - "/mnt/d/Entertainment/Movies:/movies"
      - "/mnt/d/Entertainment/TV:/tv"

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"