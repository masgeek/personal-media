services:
  suggestarr:
    image: ghcr.io/giuseppe99barchetta/suggestarr:${TAG:-latest}
    container_name: suggestarr
    hostname: suggestarr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUGGESTARR_PORT: 5000
      TZ: ${TZ:-Africa/Nairobi}
    ports:
      - "5000:5000"
    volumes:
      - suggestarr-config:/app/config/config_files
    networks:
      - dokploy-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  suggestarr-config:
    name: suggestarr-config

networks:
  dokploy-network:
    external: true
