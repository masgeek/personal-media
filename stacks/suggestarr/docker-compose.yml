services:
  suggestarr:
    image: ghcr.io/giuseppe99barchetta/suggestarr:${TAG:-latest}
    container_name: suggestarr
    hostname: suggestarr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUGGESTARR_PORT: 5000
      TZ: ${TZ:-UTC}
    network_mode: host
    volumes:
      - suggestarr-config:/app/config/config_files
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  suggestarr-config:
    name: suggestarr-config
