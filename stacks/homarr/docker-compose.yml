services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    hostname: homarr
    restart: unless-stopped
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY:?HOMARR_SECRET_ENCRYPTION_KEY is required}
    ports:
      - "127.0.0.1:7575:7575"
    volumes:
      - homarr-data:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host
    # networks:
    #   - dokploy-network
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homarr-data:
    name: homarr-data