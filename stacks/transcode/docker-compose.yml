services:
  transcode:
    image: revenz/fileflows:${TRANSCODE_TAG:-stable}
    container_name: transcode
    hostname: transcode
    restart: unless-stopped
    networks:
      - dokploy-network
    extra_hosts:
      # Lets FileFlows reach Jellyfin and Radarr/Sonarr on the Windows host.
      - "host.docker.internal:host-gateway"
    ports:
      - "19200:5000"
    environment:
      PUID: ${TRANSCODE_PUID:-1000}
      PGID: ${TRANSCODE_PGID:-1000}
      TZ: ${TZ:-UTC}

      # GPU passthrough is disabled. To enable NVIDIA transcoding later, install
      # the NVIDIA container toolkit in WSL2, then uncomment the two lines below
      # and the reservations block under deploy. Full steps are in README.md.
      # NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # NVIDIA_VISIBLE_DEVICES: all

    volumes:
      # Settings, flows, and library configuration
      - ../files/transcode/config:/app/Data
      # Temporary conversion files. Keep this on local SSD if possible.
      - ../files/transcode/cache:/temp
      - "/mnt/d/Entertainment/Movies:/library/Movies"
      - "/mnt/d/Entertainment/TV:/library/TV"

    deploy:
      resources:
        limits:
          memory: 2G
        # Uncomment together with the NVIDIA_* variables above once the NVIDIA
        # container toolkit is installed. Without the toolkit registered as a
        # Docker runtime, the daemon rejects this block and refuses to start.
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true