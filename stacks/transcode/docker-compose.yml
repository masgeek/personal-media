services:
  transcode:
    image: ${TRANSCODE_IMAGE:-ghcr.io/unmanic/unmanic:latest}
    container_name: transcode
    hostname: transcode
    restart: unless-stopped
    networks:
      - dokploy-network
    ports:
      - "8888:8888"
    environment:
      PUID: ${TRANSCODE_PUID:-1000}
      PGID: ${TRANSCODE_PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      # Settings, presets, and installed plugins
      - ../files/transcode/config:/config
      # Temporary conversion files. Keep this on local SSD if possible.
      - ../files/transcode/cache:/tmp/unmanic
      - "/mnt/d/Entertainment/Movies:/library/Movies"
      - "/mnt/d/Entertainment/TV:/library/TV"
    deploy:
      resources:
        limits:
          memory: 2G
        # Uncomment together with the NVIDIA_* variables above once the NVIDIA
        # container toolkit is installed. Without the toolkit registered as a
        # Docker runtime, the daemon rejects this block and refuses to start.
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

    # Hardware transcoding is disabled. To enable NVIDIA transcoding, install
    # the NVIDIA container toolkit in WSL2, then uncomment the two lines below
    # and the reservations block under deploy. Full steps are in README.md.
    # NVIDIA_DRIVER_CAPABILITIES: all
    # NVIDIA_VISIBLE_DEVICES: all

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true